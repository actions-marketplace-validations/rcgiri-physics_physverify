[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "physverify"
version = "0.1.0"
description = "Verification checks for physics simulation code: manufactured solutions, order-of-accuracy studies and a seeded-bug benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ram Chandra Giri" }]
keywords = ["verification", "method of manufactured solutions", "numerical methods", "physics", "simulation", "testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Framework :: Pytest",
    "Development Status :: 3 - Alpha",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
symbolic = ["sympy>=1.12"]
dev = ["pytest>=8", "hypothesis>=6", "sympy>=1.12"]

[project.scripts]
physverify = "physverify.cli:main"

[project.entry-points.pytest11]
physverify = "physverify.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
